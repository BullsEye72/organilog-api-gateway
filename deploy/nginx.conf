# Example only: replace domain, certificates, root, and PHP-FPM socket.
server {
    listen 80;
    server_name organilog.example.com;
    return 301 https://organilog.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name organilog.example.com;
    root /srv/organilog/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/organilog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/organilog.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/v1(?:/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ ^/(setup|branding)\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    # No other direct PHP entry points or hidden files are served.
    location ~ /\. { return 404; }
    location ~ \.php(?:/|$) { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
