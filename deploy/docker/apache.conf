ServerName localhost

<Directory /var/www/organilog>
    AllowOverride All
    Require all denied
</Directory>

<Directory /var/www/organilog/public>
    AllowOverride All
    Require all granted
    Options -Indexes
</Directory>

<VirtualHost *:80>
    DocumentRoot /var/www/organilog/public
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/organilog/public
    SSLEngine on
    SSLCertificateFile /tmp/organilog-tls/cert.pem
    SSLCertificateKeyFile /tmp/organilog-tls/key.pem
</VirtualHost>
