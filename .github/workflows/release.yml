name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested ZIP
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist
      - name: Verify checksum and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          sha256sum --check "organilog-${RELEASE_TAG}.zip.sha256"
          gh release create "$RELEASE_TAG" \
            "organilog-${RELEASE_TAG}.zip" \
            "organilog-${RELEASE_TAG}.zip.sha256" \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
