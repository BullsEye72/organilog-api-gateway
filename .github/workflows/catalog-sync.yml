name: Catalog sync

on:
  schedule:
    - cron: '23 7 * * 1' # Mondays at 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Compare published Organilog catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check catalog sync
        run: node bin/check-catalog.mjs --report-dir "$RUNNER_TEMP/catalog-sync"
      - name: Publish maintainer summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/catalog-sync/report.md" ]; then
            cat "$RUNNER_TEMP/catalog-sync/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save comparison report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-sync
          path: ${{ runner.temp }}/catalog-sync/
          if-no-files-found: warn
          retention-days: 30
