name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  php:
    name: PHP ${{ matrix.php }} and release ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    env:
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, json, session
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -n 1 php -l
      - name: Build installable ZIP and checksum
        run: bash .github/scripts/package-release.sh "$RELEASE_VERSION"
      - name: Run offline suite against the extracted ZIP
        shell: bash
        run: |
          unzip -q "dist/organilog-${RELEASE_VERSION}.zip" -d "$RUNNER_TEMP/release-smoke"
          cp -R tests "$RUNNER_TEMP/release-smoke/organilog/tests"
          php "$RUNNER_TEMP/release-smoke/organilog/tests/run.php"
      - name: Save tested release package
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  console:
    name: Console checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tests/console_status_test.js
      - run: node tests/console_requests_test.js

  apache:
    name: Docker and Apache checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose --profile test run --rm test
      - run: docker compose --profile test run --rm apache-test

  passed:
    name: CI passed
    if: always()
    needs: [php, console, apache]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          ALL_PASSED: ${{ needs.php.result == 'success' && needs.console.result == 'success' && needs.apache.result == 'success' }}
        run: test "$ALL_PASSED" = true
